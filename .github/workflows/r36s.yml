name: R36S NDLL

# Recompila a biblioteca nativa do Lime (lime.ndll) para Linux ARM64 com SDL em KMSDRM,
# compilando com zig cc (glibc alvo 2.28, libc++) para rodar no ArkOS do R36S.
on:
  push:
    branches: [r36s-port]
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7

jobs:
  ndll:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Ferramentas do host
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap binutils python3-pip
          sudo pip3 install --break-system-packages "ziglang==0.14.1" || sudo pip3 install --break-system-packages ziglang
          python3 -c "import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),'zig'))"

      - name: Sysroot Debian bullseye (glibc 2.31, GCC 10)
        run: |
          sudo debootstrap --arch=arm64 --variant=minbase --no-check-gpg bullseye /opt/sysroot http://archive.debian.org/debian/
          echo "deb http://archive.debian.org/debian bullseye main" | sudo tee /opt/sysroot/etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' | sudo tee /opt/sysroot/etc/apt/apt.conf.d/99archive
          sudo mount --bind /proc /opt/sysroot/proc
          sudo chroot /opt/sysroot apt-get update
          sudo chroot /opt/sysroot apt-get install -y --no-install-recommends --allow-unauthenticated \
            libc6-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libdbus-1-dev libudev-dev
          sudo umount /opt/sysroot/proc
          ls /opt/sysroot/usr/include | head -30

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Dependências Haxe
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/ShadowEngineTeam/hxcpp --quiet
          haxelib git format https://github.com/HaxeFoundation/format 9d69fb342d030fa120d2deafafbbffad248332b8 --quiet
          haxelib git hxp https://github.com/openfl/hxp 47ef5ae6569cb0961761a2fbb416694df067124c --quiet
          haxelib dev lime ${{ github.workspace }}

      - name: Recompilar lime.ndll (KMSDRM)
        run: |
          # zig cc: libc++ moderno (C++20 completo) e glibc alvo 2.28; o sysroot só fornece headers/libs de libdrm, gbm, ALSA, dbus, udev
          ZIG=$(python3 -c "import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),'zig'))")
          SR=/opt/sysroot
          EXTRA="-idirafter $SR/usr/include -idirafter $SR/usr/include/aarch64-linux-gnu -idirafter $SR/usr/include/libdrm -idirafter $SR/usr/include/dbus-1.0 -idirafter $SR/usr/lib/aarch64-linux-gnu/dbus-1.0/include -L$SR/usr/lib/aarch64-linux-gnu -L$SR/lib/aarch64-linux-gnu"
          # wrapper: descarta -march=armv8-a (zig não aceita; o alvo aarch64 padrão já é ARMv8-A)
          for m in cc c++; do
            if [ "$m" = cc ]; then name=zcc; std=""; else name=zcxx; std="-std=gnu++20"; fi
            sudo tee /usr/local/bin/$name >/dev/null <<EOF
          #!/bin/sh
          n=\$#
          while [ \$n -gt 0 ]; do
            a=\$1; shift; n=\$((n-1))
            case "\$a" in -march=armv8-a) ;; *) set -- "\$@" "\$a";; esac
          done
          exec $ZIG $m $std -target aarch64-linux-gnu.2.28 $EXTRA "\$@"
          EOF
            sudo chmod +x /usr/local/bin/$name
          done
          export CC=/usr/local/bin/zcc CXX=/usr/local/bin/zcxx
          haxelib run lime rebuild linux -arm64 -release -D HXCPP_ARM64 -D LIME_KMSDRM

      - name: Verificar o resultado
        run: |
          f=ndll/LinuxArm64/lime.ndll
          ls -l ndll/LinuxArm64/
          file $f
          echo "--- bibliotecas necessárias"
          readelf -d $f | grep NEEDED
          echo "--- maior versão de glibc exigida"
          objdump -T $f | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5
          echo "--- libstdc++ dinâmico (esperado: nenhum)"
          readelf -d $f | grep -c libstdc || true
          echo "--- KMSDRM presente?"
          strings $f | grep -c -i kmsdrm
          echo "--- X11/Wayland ausentes?"
          strings $f | grep -c -i -E 'libX11|libwayland' || true
          max=$(objdump -T $f | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "max glibc: $max"
          test "$(printf '%s\n' 2.28 "$max" | sort -V | tail -1)" = "2.28"

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          name: LinuxArm64-NDLL-KMSDRM
          path: ndll/LinuxArm64/
          if-no-files-found: error
